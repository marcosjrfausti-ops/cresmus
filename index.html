<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, collection, addDoc, updateDoc, doc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDTyVjHdTo5vmRhqGzpyPGlLXolzu31dYo",
        authDomain: "painel-fotografico-galpao.firebaseapp.com",
        projectId: "painel-fotografico-galpao",
        storageBucket: "painel-fotografico-galpao.firebasestorage.app",
        messagingSenderId: "521603564212",
        appId: "1:521603564212:web:e4585543f470e214b54de1",
        measurementId: "G-0QX19DYWT5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let usuarioAtivo = "";

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // --- DICIONÁRIO DE MÚSCULOS E REPOSITÓRIO DE EXERCÍCIOS ---
    const muscleDictionary = {
        "Remada Articulada Fechada": "COSTAS",
        "Remada Aberta Polia": "COSTAS",
        "Puxada Alta Triângulo": "COSTAS",
        "Remada Baixa": "COSTAS",
        "Pulley Frente": "COSTAS",
        "Peck Deck": "PEITO",
        "Supino Inclinado com Halteres": "PEITO",
        "Supino Reto Halteres": "PEITO",
        "Crossover Superior": "PEITO",
        "Crossover Inferior": "PEITO",
        "Agachamento Búlgaro": "PERNAS (QUADRÍCEPS/GLÚTEO)",
        "Agachamento Livre": "PERNAS (QUADRÍCEPS/GLÚTEO)",
        "Cadeira Extensora Quadríceps Femoral": "PERNAS (QUADRÍCEPS/GLÚTEO)",
        "Cadeira Extensora Unilateral": "PERNAS (QUADRÍCEPS/GLÚTEO)",
        "Leg Press": "PERNAS (QUADRÍCEPS/GLÚTEO)",
        "Hack Machine": "PERNAS (QUADRÍCEPS/GLÚTEO)",
        "Mesa Flexora": "POSTERIOR DE COXA",
        "Stiff": "POSTERIOR DE COXA",
        "Gêmeos em Pé": "PANTURRILHA",
        "Gêmeos Sentado": "PANTURRILHA",
        "Tríceps Polia Bilateral com Corda": "TRÍCEPS",
        "Tríceps Testa": "TRÍCEPS",
        "Tríceps Francês": "TRÍCEPS",
        "Rosca Martelo": "BÍCEPS",
        "Rosca Inversa": "BÍCEPS",
        "Rosca Direta": "BÍCEPS",
        "Rosca 45º": "BÍCEPS",
        "Elevação Lateral Halteres": "OMBRO",
        "Elevação Lateral Polia": "OMBRO",
        "Flexão de Punho": "ANTEBRAÇO",
        "Cadeira Adutora": "ADUTORES/ABDUTORES",
        "Cadeira Abdutora": "ADUTORES/ABDUTORES"
    };

    const exercisesRepository = Object.entries(muscleDictionary).map(([nome, musculo]) => ({
        nome,
        musculo,
        criadoPor: "sistema"
    }));

    async function carregarExerciciosCustomizados() {
        try {
            const snap = await getDocs(collection(db, "exercicios_customizados"));
            snap.forEach(docSnap => {
                const data = docSnap.data();
                if (data.nome && data.musculo) {
                    muscleDictionary[data.nome] = data.musculo;
                    const jaExiste = exercisesRepository.some(
                        ex => ex.nome.toLowerCase() === data.nome.toLowerCase()
                    );
                    if (!jaExiste) {
                        exercisesRepository.push({
                            nome: data.nome,
                            musculo: data.musculo,
                            criadoPor: data.criadoPor || "desconhecido"
                        });
                    }
                }
            });
            renderDropdownList(dropdownSearchInput.value);
        } catch (err) {
            console.error("Erro ao carregar exercícios customizados:", err);
        }
    }

    // =================================================================
    // LÓGICA DO BOTTOM SHEET CUSTOMIZADO DE NÚMEROS (GRADE 5 COLUNAS)
    // =================================================================
    const numberPickerSheet = document.getElementById('number-picker-sheet');
    const numberPickerTitle = document.getElementById('number-picker-title');
    const numberPickerGrid = document.getElementById('number-picker-grid');
    const btnCloseNumberSheet = document.getElementById('btn-close-number-sheet');

    let activeNumberButton = null;

    function abrirSeletorDeNumeros(targetBtn, maxNumber, labelTitulo) {
        if (targetBtn.disabled) return;
        activeNumberButton = targetBtn;
        const currentValue = Number(targetBtn.dataset.value || targetBtn.textContent);

        numberPickerTitle.textContent = labelTitulo;
        numberPickerGrid.innerHTML = '';

        for (let i = 1; i <= maxNumber; i++) {
            const squareBtn = document.createElement('button');
            squareBtn.type = 'button';
            squareBtn.className = 'num-square-btn';
            if (i === currentValue) {
                squareBtn.classList.add('selected');
            }
            squareBtn.textContent = i;

            squareBtn.addEventListener('click', () => {
                activeNumberButton.dataset.value = i;
                activeNumberButton.textContent = i;
                fecharSeletorDeNumeros();
            });

            numberPickerGrid.appendChild(squareBtn);
        }

        numberPickerSheet.classList.add('open');

        // Centraliza a rolagem no item atualmente selecionado
        const selectedEl = numberPickerGrid.querySelector('.selected');
        if (selectedEl) {
            setTimeout(() => {
                selectedEl.scrollIntoView({ block: 'center', behavior: 'instant' });
            }, 20);
        }
    }

    function fecharSeletorDeNumeros() {
        numberPickerSheet.classList.remove('open');
        activeNumberButton = null;
    }

    btnCloseNumberSheet.addEventListener('click', fecharSeletorDeNumeros);
    numberPickerSheet.addEventListener('click', (e) => {
        if (e.target === numberPickerSheet) {
            fecharSeletorDeNumeros();
        }
    });

    // =================================================================
    // LÓGICA DO DROPDOWN CUSTOMIZADO (TELA 2)
    // =================================================================
    const customDropdown = document.getElementById('custom-exercise-dropdown');
    const dropdownTrigger = document.getElementById('dropdown-trigger');
    const dropdownMenu = document.getElementById('dropdown-menu');
    const dropdownSearchInput = document.getElementById('dropdown-search-input');
    const dropdownExerciseList = document.getElementById('dropdown-exercise-list');
    const btnOpenAddExModal = document.getElementById('btn-open-add-ex-modal');

    function toggleDropdown(forceState) {
        const isOpen = typeof forceState === 'boolean' ? forceState : !dropdownMenu.classList.contains('open');
        dropdownMenu.classList.toggle('open', isOpen);
        dropdownTrigger.classList.toggle('open', isOpen);

        if (isOpen) {
            dropdownSearchInput.value = '';
            renderDropdownList('');
            setTimeout(() => dropdownSearchInput.focus(), 50);
        }
    }

    dropdownTrigger.addEventListener('click', () => toggleDropdown());

    document.addEventListener('click', (e) => {
        if (!customDropdown.contains(e.target)) {
            toggleDropdown(false);
        }
    });

    dropdownSearchInput.addEventListener('input', (e) => {
        renderDropdownList(e.target.value);
    });

    function renderDropdownList(filterText = '') {
        dropdownExerciseList.innerHTML = '';
        const termo = filterText.trim().toLowerCase();

        const filtrados = Object.keys(muscleDictionary).filter(exName =>
            exName.toLowerCase().includes(termo)
        );

        if (filtrados.length === 0) {
            const emptyLi = document.createElement('li');
            emptyLi.className = 'dropdown-empty-state';
            emptyLi.textContent = 'Nenhum exercício encontrado.';
            dropdownExerciseList.appendChild(emptyLi);
            return;
        }

        filtrados.forEach(exName => {
            const li = document.createElement('li');
            li.className = 'dropdown-option-item';
            li.textContent = exName;
            li.addEventListener('click', () => {
                adicionarCardExercicioTela2(exName);
                toggleDropdown(false);
            });
            dropdownExerciseList.appendChild(li);
        });
    }

    renderDropdownList();
    carregarExerciciosCustomizados();

    // --- MODAL DE ADICIONAR NOVO EXERCÍCIO ---
    const modalNewExercise = document.getElementById('modal-new-exercise');
    const inputNewExName = document.getElementById('new-ex-name');
    const selectNewExMuscle = document.getElementById('new-ex-muscle');
    const btnCancelNewEx = document.getElementById('btn-cancel-new-ex');
    const btnSaveNewEx = document.getElementById('btn-save-new-ex');

    btnOpenAddExModal.addEventListener('click', () => {
        inputNewExName.value = dropdownSearchInput.value.trim();
        toggleDropdown(false);
        modalNewExercise.classList.add('open');
        setTimeout(() => inputNewExName.focus(), 50);
    });

    btnCancelNewEx.addEventListener('click', () => {
        modalNewExercise.classList.remove('open');
        inputNewExName.value = '';
    });

    btnSaveNewEx.addEventListener('click', async () => {
        const nomeNovo = inputNewExName.value.trim();
        const musculoNovo = selectNewExMuscle.value;

        if (!nomeNovo) {
            showToast("Digite o nome do exercício!");
            return;
        }

        const novoExercicioObj = {
            nome: nomeNovo,
            musculo: musculoNovo,
            criadoPor: usuarioAtivo || "anonimo",
            criadoEm: new Date().toISOString()
        };

        muscleDictionary[nomeNovo] = musculoNovo;
        const jaExiste = exercisesRepository.some(
            ex => ex.nome.toLowerCase() === nomeNovo.toLowerCase()
        );
        if (!jaExiste) {
            exercisesRepository.push(novoExercicioObj);
        }

        try {
            btnSaveNewEx.disabled = true;
            btnSaveNewEx.textContent = "SALVANDO...";
            await addDoc(collection(db, "exercicios_customizados"), novoExercicioObj);
        } catch (err) {
            console.error("Erro ao salvar exercício customizado no Firebase:", err);
        } finally {
            btnSaveNewEx.disabled = false;
            btnSaveNewEx.textContent = "Salvar";
        }

        renderDropdownList();
        modalNewExercise.classList.remove('open');
        inputNewExName.value = '';

        adicionarCardExercicioTela2(nomeNovo);
        showToast(`"${nomeNovo}" adicionado à lista!`);
    });

    // --- NAVEGAÇÃO ENTRE TELAS ---
    const screens = {
        s0: document.getElementById('screen-0'),
        s1: document.getElementById('screen-1'),
        s2: document.getElementById('screen-2'),
        s3: document.getElementById('screen-3'),
        s4: document.getElementById('screen-4')
    };

    function switchScreen(activeScreen) {
        Object.values(screens).forEach(s => s.classList.remove('active'));
        activeScreen.classList.add('active');
    }

    // --- LÓGICA DA TELA 0: LOGIN DE PERFIL ---
    const inputLoginUser = document.getElementById('login-user');
    const inputLoginPass = document.getElementById('login-pass');
    const displayUsername = document.getElementById('display-username');

    document.getElementById('btn-entrar').addEventListener('click', () => {
        const userVal = inputLoginUser.value.trim();
        const passVal = inputLoginPass.value.trim();

        if (!userVal || !passVal) {
            showToast("Preencha usuário e senha para entrar!");
            return;
        }

        usuarioAtivo = userVal;
        displayUsername.textContent = usuarioAtivo;
        showToast(`Bem-vindo, ${usuarioAtivo}!`);
        switchScreen(screens.s1);
    });

    document.getElementById('btn-logout').addEventListener('click', () => {
        usuarioAtivo = "";
        inputLoginUser.value = "";
        inputLoginPass.value = "";
        switchScreen(screens.s0);
    });

    document.getElementById('btn-nova-rotina').addEventListener('click', () => switchScreen(screens.s2));
    document.getElementById('back-from-s2').addEventListener('click', () => switchScreen(screens.s1));
    document.getElementById('btn-cronograma').addEventListener('click', () => {
        carregarRotinasDoFirebase();
        switchScreen(screens.s3);
    });
    document.getElementById('back-to-home').addEventListener('click', () => switchScreen(screens.s1));
    document.getElementById('back-to-menu').addEventListener('click', () => switchScreen(screens.s3));

    // =================================================================
    // LÓGICA DA TELA 2: AGRUPAMENTO POR MÚSCULO EM CARROSSEL E GRAVAÇÃO
    // =================================================================
    const exerciseContainer = document.getElementById('exercise-container');
    const inputNomeRotina = document.getElementById('input-nome');
    const selectDiaRef = document.getElementById('select-dia');
    const inputNomeTreino = document.getElementById('input-treino');
    
    let sessoesTemporarias = [];

    // Ajusta a classe .single-card dinamicamente conforme o número de cards no carrossel do músculo
    function atualizarLarguraCardsCarrossel(carouselEl) {
        const cards = carouselEl.querySelectorAll('.carousel-card');
        cards.forEach(c => {
            if (cards.length === 1) {
                c.classList.add('single-card');
            } else {
                c.classList.remove('single-card');
            }
        });
    }

    function adicionarCardExercicioTela2(exerciseName) {
        if (!exerciseName) return;

        // 1. Identifica o grupo muscular pelo muscleDictionary
        const muscle = muscleDictionary[exerciseName] || "OUTROS";

        // 2. Verifica se já existe um container para esse músculo na Tela 2; se não, cria
        let groupDiv = exerciseContainer.querySelector(`.muscle-group[data-muscle="${muscle}"]`);
        let carousel;

        if (!groupDiv) {
            groupDiv = document.createElement('div');
            groupDiv.className = 'muscle-group';
            groupDiv.dataset.muscle = muscle;
            groupDiv.innerHTML = `
                <h3 class="muscle-title">${muscle}</h3>
                <div class="carousel"></div>
            `;
            exerciseContainer.appendChild(groupDiv);
        }

        carousel = groupDiv.querySelector('.carousel');

        // 3. Cria o card do exercício dentro do carrossel horizontal (.carousel-card + .exercise-card)
        const card = document.createElement('div');
        card.className = 'carousel-card exercise-card';
        card.dataset.exerciseName = exerciseName;
        
        let validSetsCount = 0;

        card.innerHTML = `
            <h3 class="exercise-card-title">${exerciseName}</h3>
            <div class="sets-wrapper" style="display: flex; flex-direction: column; gap: 8px;">
                <div class="set-row">Reconhecimento</div>
                <div class="valid-sets-container" style="display: flex; flex-direction: column; gap: 8px;"></div>
            </div>
            <div class="card-controls">
                <button type="button" class="btn-control btn-minus">-</button>
                <button type="button" class="btn-control btn-plus">+</button>
            </div>
        `;

        const validSetsContainer = card.querySelector('.valid-sets-container');
        const btnPlus = card.querySelector('.btn-plus');
        const btnMinus = card.querySelector('.btn-minus');

        // 5. Mantém a funcionalidade dos botões (+) e (-)
        btnPlus.addEventListener('click', () => {
            validSetsCount++;
            const newRow = document.createElement('div');
            newRow.className = 'set-row valid-set';
            newRow.textContent = `${validSetsCount}ª Válida`;
            validSetsContainer.appendChild(newRow);
        });

        btnMinus.addEventListener('click', () => {
            if (validSetsCount > 0) {
                validSetsContainer.lastElementChild.remove();
                validSetsCount--;
            }
        });

        carousel.appendChild(card);
        atualizarLarguraCardsCarrossel(carousel);

        // Faz scroll suave para mostrar o novo card adicionado no carrossel
        setTimeout(() => {
            card.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }, 50);
    }

    function capturarDiaAtualTela2() {
        const cards = exerciseContainer.querySelectorAll('.exercise-card');
        if (cards.length === 0) return null;

        const exerciciosDoDia = [];
        cards.forEach(card => {
            const nome = card.dataset.exerciseName;
            const series = [];
            card.querySelectorAll('.set-row').forEach(row => {
                series.push(row.textContent.trim());
            });
            exerciciosDoDia.push({ nome, series });
        });

        return {
            nomeSessao: inputNomeTreino.value.trim() || `SESSÃO ${sessoesTemporarias.length + 1}`,
            diaSessao: selectDiaRef.value,
            exercicios: exerciciosDoDia
        };
    }

    document.getElementById('btn-salvar-dia').addEventListener('click', () => {
        if (!inputNomeRotina.value.trim()) {
            showToast("Preencha o NOME DA ROTINA!");
            return;
        }
        const diaCapturado = capturarDiaAtualTela2();
        if (!diaCapturado) {
            showToast("Adicione pelo menos 1 exercício!");
            return;
        }

        sessoesTemporarias.push(diaCapturado);
        
        exerciseContainer.innerHTML = '';
        inputNomeTreino.value = '';
        showToast(`Dia (${diaCapturado.diaSessao}) salvo na memória!`);
    });

    const btnConcluirRotina = document.getElementById('btn-concluir-rotina');
    btnConcluirRotina.addEventListener('click', async () => {
        const nomeRotina = inputNomeRotina.value.trim();
        if (!nomeRotina) {
            showToast("Preencha o NOME DA ROTINA!");
            return;
        }

        const diaAtual = capturarDiaAtualTela2();
        if (diaAtual) {
            sessoesTemporarias.push(diaAtual);
        }

        if (sessoesTemporarias.length === 0) {
            showToast("Adicione pelo menos 1 dia com exercícios!");
            return;
        }

        const pacoteRotina = {
            usuario: usuarioAtivo,
            nomeRotina: nomeRotina.toUpperCase(),
            sessoes: sessoesTemporarias,
            criadoEm: new Date().toISOString()
        };

        try {
            btnConcluirRotina.disabled = true;
            btnConcluirRotina.textContent = "SALVANDO NO BANCO...";

            const docRef = await addDoc(collection(db, "rotinas"), pacoteRotina);
            console.log("Rotina salva no Firestore com ID:", docRef.id);
            showToast("Rotina salva no Firebase com sucesso!");

            sessoesTemporarias = [];
            inputNomeRotina.value = '';
            inputNomeTreino.value = '';
            exerciseContainer.innerHTML = '';

            switchScreen(screens.s1);
        } catch (error) {
            console.error("Erro ao salvar rotina no Firebase:", error);
            showToast("Erro ao salvar no Firebase. Verifique o console.");
        } finally {
            btnConcluirRotina.disabled = false;
            btnConcluirRotina.textContent = "Concluir Rotina";
        }
    });

    // =================================================================
    // TELA 3: CARREGAR ROTINAS EXCLUSIVAMENTE DO FIREBASE
    // =================================================================
    const routinesListContainer = document.getElementById('routines-list');
    async function carregarRotinasDoFirebase() {
        routinesListContainer.innerHTML = `<p class="empty-msg">Buscando rotinas na base...</p>`;

        try {
            const querySnapshot = await getDocs(collection(db, "rotinas"));
            routinesListContainer.innerHTML = '';

            if (querySnapshot.empty) {
                routinesListContainer.innerHTML = `<p class="empty-msg">Nenhuma rotina cadastrada no banco ainda.</p>`;
                return;
            }

            querySnapshot.forEach((docSnap) => {
                const dadosRotina = docSnap.data();
                const btn = document.createElement('button');
                btn.className = 'btn-main';
                btn.textContent = dadosRotina.nomeRotina;
                btn.addEventListener('click', () => abrirRotinaNaTela4(dadosRotina));
                routinesListContainer.appendChild(btn);
            });
        } catch (error) {
            console.error("Erro ao buscar rotinas:", error);
            routinesListContainer.innerHTML = `<p class="empty-msg">Erro ao carregar rotinas do banco.</p>`;
        }
    }

    // =================================================================
    // LÓGICA DA TELA 4: EXECUÇÃO DINÂMICA COM SELETOR NUMÉRICO CUSTOMIZADO
    // =================================================================
    const dayRefHeader = document.getElementById('exec-day-ref');
    const dateInput = document.getElementById('exec-date');
    const sessionSelect = document.getElementById('exec-session-select');
    const execContainer = document.getElementById('exec-container');
    const diasDaSemana = ["DOMINGO", "SEGUNDA", "TERÇA", "QUARTA", "QUINTA", "SEXTA", "SÁBADO"];

    let rotinaAtivaAtual = null;

    function sincronizarSessaoPeloDia(diaDaSemanaStr) {
        if (!rotinaAtivaAtual || !rotinaAtivaAtual.sessoes) return;

        const indexEncontrado = rotinaAtivaAtual.sessoes.findIndex(
            s => s.diaSessao && s.diaSessao.toUpperCase() === diaDaSemanaStr.toUpperCase()
        );

        if (indexEncontrado !== -1) {
            sessionSelect.value = indexEncontrado;
            renderSession(rotinaAtivaAtual.sessoes[indexEncontrado]);
        } else {
            const currentIdx = sessionSelect.value || 0;
            renderSession(rotinaAtivaAtual.sessoes[currentIdx]);
        }
    }

    dateInput.addEventListener('change', (e) => {
        const val = e.target.value;
        if (!val) return;
        const parts = val.split('-'); 
        const dateObj = new Date(parts[0], parts[1] - 1, parts[2]);
        const novoDiaSemana = diasDaSemana[dateObj.getDay()];
        
        dayRefHeader.textContent = novoDiaSemana;
        sincronizarSessaoPeloDia(novoDiaSemana);
    });

    function setTodayDate() {
        const hoje = new Date();
        const ano = hoje.getFullYear();
        const mes = String(hoje.getMonth() + 1).padStart(2, '0');
        const dia = String(hoje.getDate()).padStart(2, '0');
        dateInput.value = `${ano}-${mes}-${dia}`;
        const diaSemanaHoje = diasDaSemana[hoje.getDay()];
        dayRefHeader.textContent = diaSemanaHoje;
        return diaSemanaHoje;
    }

    function renderSession(session) {
        execContainer.innerHTML = '';
        if (!session || !session.exercicios) return;
        
        const groups = {};
        session.exercicios.forEach(ex => {
            const muscle = muscleDictionary[ex.nome] || "OUTROS";
            if (!groups[muscle]) groups[muscle] = [];
            groups[muscle].push(ex);
        });

        for (const [muscle, exercises] of Object.entries(groups)) {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'muscle-group';
            groupDiv.innerHTML = `<h3 class="muscle-title">${muscle}</h3>`;
            
            const carousel = document.createElement('div');
            carousel.className = 'carousel';
            const cardClass = exercises.length === 1 ? 'carousel-card single-card' : 'carousel-card';

            exercises.forEach(ex => {
                const card = document.createElement('div');
                card.className = cardClass;

                let setsHTML = '';
                ex.series.forEach(serie => {
                    setsHTML += `
                        <div class="exec-set-row" data-serie="${serie}">
                            <span class="exec-set-label">${serie}</span>
                            <div class="exec-set-inputs">
                                <button type="button" class="btn-num-picker select-kg" data-value="1">1</button>
                                <span class="exec-suffix">kg x</span>
                                <button type="button" class="btn-num-picker select-reps" data-value="1">1</button>
                                <span class="exec-suffix">Reps</span>
                            </div>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <h4 class="exec-card-title">${ex.nome}</h4>
                    <div class="exec-sets-wrapper" style="display: flex; flex-direction: column; gap: 12px;">
                        ${setsHTML}
                    </div>
                    <div class="card-footer">
                        <button type="button" class="btn-card-action">SALVAR</button>
                    </div>
                `;

                // Conecta os botões de Peso (1-250) e Reps (1-25) ao Bottom Sheet
                card.querySelectorAll('.select-kg').forEach(btnKg => {
                    btnKg.addEventListener('click', () => {
                        abrirSeletorDeNumeros(btnKg, 250, `${ex.nome} — Carga (kg)`);
                    });
                });

                card.querySelectorAll('.select-reps').forEach(btnReps => {
                    btnReps.addEventListener('click', () => {
                        abrirSeletorDeNumeros(btnReps, 25, `${ex.nome} — Repetições`);
                    });
                });

                const btnAction = card.querySelector('.btn-card-action');
                const pickerBtns = card.querySelectorAll('.btn-num-picker');
                const setRows = card.querySelectorAll('.exec-set-row');

                btnAction.addEventListener('click', async () => {
                    const isSaved = card.classList.contains('card-salvo');

                    if (!isSaved) {
                        const seriesExecutadas = [];
                        setRows.forEach(row => {
                            const nomeSerie = row.getAttribute('data-serie');
                            const kg = Number(row.querySelector('.select-kg').dataset.value);
                            const reps = Number(row.querySelector('.select-reps').dataset.value);
                            seriesExecutadas.push({ serie: nomeSerie, kg, reps });
                        });

                        const dadosExercicio = {
                            usuario: usuarioAtivo,
                            nomeRotina: rotinaAtivaAtual.nomeRotina,
                            nomeTreino: session.nomeSessao,
                            diaProgramadoSessao: session.diaSessao,
                            dataExecucao: dateInput.value,
                            diaSemana: dayRefHeader.textContent,
                            musculo: muscle,
                            exercicio: ex.nome,
                            series: seriesExecutadas,
                            atualizadoEm: new Date().toISOString()
                        };

                        try {
                            btnAction.disabled = true;
                            btnAction.textContent = "SALVANDO...";

                            const existingDocId = card.dataset.firestoreId;

                            if (!existingDocId) {
                                const docRef = await addDoc(collection(db, "treinos_executados"), dadosExercicio);
                                card.dataset.firestoreId = docRef.id;
                                console.log(`[CRIADO NO FIREBASE] ID: ${docRef.id}`, dadosExercicio);
                                showToast(`${ex.nome} registrado!`);
                            } else {
                                const docRef = doc(db, "treinos_executados", existingDocId);
                                await updateDoc(docRef, dadosExercicio);
                                console.log(`[ATUALIZADO NO FIREBASE] ID: ${existingDocId}`, dadosExercicio);
                                showToast(`${ex.nome} atualizado!`);
                            }

                            card.classList.add('card-salvo');
                            pickerBtns.forEach(b => b.disabled = true);
                            btnAction.textContent = 'CORRIGIR';
                            btnAction.classList.add('btn-corrigir');

                        } catch (error) {
                            console.error("Erro ao gravar exercício no Firestore:", error);
                            showToast("Erro ao salvar no Firebase!");
                            btnAction.textContent = 'SALVAR';
                        } finally {
                            btnAction.disabled = false;
                        }

                    } else {
                        card.classList.remove('card-salvo');
                        pickerBtns.forEach(b => b.disabled = false);
                        btnAction.textContent = 'SALVAR';
                        btnAction.classList.remove('btn-corrigir');
                    }
                });

                carousel.appendChild(card);
            });

            groupDiv.appendChild(carousel);
            execContainer.appendChild(groupDiv);
        }
    }

    function abrirRotinaNaTela4(rotina) {
        rotinaAtivaAtual = rotina;
        switchScreen(screens.s4);
        
        document.getElementById('exec-routine-name').textContent = rotina.nomeRotina;
        const diaHoje = setTodayDate();

        sessionSelect.innerHTML = '';
        rotina.sessoes.forEach((sessao, index) => {
            const opt = document.createElement('option');
            opt.value = index;
            opt.textContent = `${sessao.nomeSessao} (${sessao.diaSessao})`;
            sessionSelect.appendChild(opt);
        });

        sincronizarSessaoPeloDia(diaHoje);
    }

    sessionSelect.addEventListener('change', (e) => {
        const index = e.target.value;
        renderSession(rotinaAtivaAtual.sessoes[index]);
    });
</script>
