<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker de Treinos</title>
    <style>
        /* Variáveis de Tema Escuro */
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --surface-highlight: #2c2c2c;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent-color: #bb86fc;
            --border-color: #333333;
            --danger-color: #cf6679;
            --border-radius: 12px;
        }

        /* Reset e Base */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        /* Controle de Telas */
        .screen {
            display: none;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            animation: fadeIn 0.3s ease;
        }
        .screen.active {
            display: flex;
            flex-direction: column;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Botoes Padrão (Telas 1 e 3) */
        .btn-main {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--text-primary);
            padding: 18px 32px;
            font-size: 1.1rem;
            border-radius: var(--border-radius);
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            transition: all 0.2s;
            margin-bottom: 16px;
        }
        .btn-main:hover:not(:disabled) {
            background: var(--surface-highlight);
            transform: scale(1.02);
        }
        .btn-main:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: var(--text-secondary);
        }

        /* ---- TELA 1 & 3 Layout ---- */
        #screen-1, #screen-3 {
            flex: 1;
            justify-content: center;
            align-items: center;
            gap: 16px;
        }
        .divider { width: 80%; border: 0; border-top: 1px dashed var(--border-color); margin: 16px 0; }
        .screen-title { font-size: 1.5rem; color: var(--accent-color); margin-bottom: 24px; text-transform: uppercase; }

        /* ---- TELA 2 (Componentes herdados) ---- */
        .header-form {
            display: flex; flex-direction: column; gap: 20px; margin-bottom: 24px;
            background: var(--surface-color); padding: 20px; border-radius: var(--border-radius); border: 1px solid var(--border-color);
        }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-weight: 600; font-size: 0.9rem; color: var(--text-secondary); text-transform: uppercase; }
        .input-group input, .input-group select, .date-input {
            background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-primary);
            padding: 12px 16px; border-radius: 8px; font-size: 1rem; color-scheme: dark; /* Para o input date no dark mode */
        }
        
        /* ---- TELA 4: EXECUÇÃO DO TREINO ---- */
        
        /* Cabeçalho Fixo (Nome e Dia) */
        .exec-header {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 16px; border-bottom: 1px solid var(--border-color); margin-bottom: 20px;
        }
        .exec-header h2 { font-size: 1.3rem; color: var(--accent-color); text-transform: uppercase; }
        .exec-header span { font-size: 1.1rem; font-weight: bold; color: var(--text-secondary); }

        /* Controle de Data e Sessão */
        .exec-controls { display: flex; flex-direction: column; gap: 16px; margin-bottom: 32px; }
        .date-wrapper { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .date-wrapper label { font-size: 0.9rem; color: var(--text-secondary); }
        .date-input { width: 100%; text-align: center; max-width: 300px; font-weight: bold;}
        .session-select { width: 100%; background: var(--surface-color); border: 1px solid var(--border-color); color: var(--accent-color); padding: 16px; border-radius: var(--border-radius); font-size: 1.1rem; font-weight: bold; }

        /* Agrupamentos por Músculo */
        .muscle-group { margin-bottom: 32px; }
        .muscle-title { font-size: 1.2rem; color: var(--text-primary); margin-bottom: 16px; border-left: 4px solid var(--accent-color); padding-left: 8px; letter-spacing: 1px;}

        /* Carrossel Horizontal */
        .carousel {
            display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
            gap: 16px; padding-bottom: 12px; scrollbar-width: none; /* Oculta scroll no Firefox */
        }
        .carousel::-webkit-scrollbar { display: none; } /* Oculta scroll no Chrome/Safari */
        
        .carousel-card {
            flex: 0 0 88%; /* Deixa 12% da próxima carta visível como pista visual */
            scroll-snap-align: center;
            background: var(--surface-color); border: 1px solid var(--border-color);
            border-radius: var(--border-radius); padding: 20px;
            display: flex; flex-direction: column; gap: 16px;
        }
        
        /* Se houver apenas 1 exercício, ocupa 100% */
        .carousel-card.single-card { flex: 0 0 100%; }

        .exec-card-title { font-size: 1.2rem; color: var(--accent-color); text-align: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px;}

        /* Linhas de Série com Inputs (Tela 4) */
        .exec-set-row {
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            background: var(--bg-color); padding: 16px 12px; border-radius: 8px;
        }
        .exec-set-label { font-weight: bold; font-size: 1.05rem; color: var(--text-primary); }
        .exec-set-inputs { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .exec-set-inputs select {
            background: var(--surface-highlight); border: 1px solid var(--border-color);
            color: var(--text-primary); padding: 8px; border-radius: 6px; font-size: 1rem; text-align: center;
            transition: opacity 0.2s, background-color 0.2s;
        }
        .exec-set-inputs select:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            background: var(--bg-color);
        }
        .exec-suffix { color: var(--danger-color); font-weight: bold; }

        /* Estados do Card (Ativo vs. Salvo) e Botão de Ação */
        .carousel-card {
            transition: opacity 0.3s ease, border-color 0.3s ease, background-color 0.3s ease;
        }
        .carousel-card.card-salvo {
            opacity: 0.55;
            background: #161616;
            border-color: #262626;
        }
        .card-footer {
            margin-top: auto;
            padding-top: 12px;
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid var(--border-color);
        }
        .btn-card-action {
            background: var(--accent-color);
            color: #000000;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            width: 100%;
        }
        .btn-card-action:hover {
            filter: brightness(1.1);
        }
        /* Estilo discreto quando o botão vira "CORRIGIR" */
        .btn-card-action.btn-corrigir {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--text-secondary);
        }

        /* Utilitários */
        .nav-back { color: var(--text-secondary); cursor: pointer; margin-bottom: 24px; display: inline-block; font-size: 0.9rem; }
    </style>
</head>
<body>

    <!-- TELA 1: Página Inicial -->
    <div id="screen-1" class="screen active">
        <button id="btn-nova-rotina" class="btn-main">+ NOVA ROTINA</button>
        <hr class="divider">
        <button id="btn-cronograma" class="btn-main">CRONOGRAMA</button>
    </div>

    <!-- TELA 2: (Omitida visualmente para brevidade, mas a lógica está preservada se precisar) -->

    <!-- TELA 3: Menu do Cronograma -->
    <div id="screen-3" class="screen">
        <div class="nav-back" id="back-to-home">← Voltar</div>
        <h2 class="screen-title">Suas Rotinas</h2>
        <!-- Botão gerado para a rotina Mockada -->
        <button class="btn-main" id="btn-open-mock">FULL BODY</button>
    </div>

    <!-- TELA 4: Execução do Treino -->
    <div id="screen-4" class="screen">
        <div class="nav-back" id="back-to-menu">← Voltar às Rotinas</div>

        <!-- Cabeçalho (Sem rótulos) -->
        <div class="exec-header">
            <h2 id="exec-routine-name">NOME ROTINA</h2>
            <span id="exec-day-ref">DIA</span>
        </div>

        <!-- Controles de Data e Sessão -->
        <div class="exec-controls">
            <div class="date-wrapper">
                <label for="exec-date">Data de Execução:</label>
                <input type="date" id="exec-date" class="date-input">
            </div>
            
            <select id="exec-session-select" class="session-select">
                <!-- Preenchido via JS -->
            </select>
        </div>

        <!-- Área onde os Carrosseis de Músculos serão gerados -->
        <div id="exec-container"></div>
    </div>

    <script>
        // --- DICIONÁRIO DE MÚSCULOS ---
        const muscleDictionary = {
            "Remada Articulada Fechada": "COSTAS",
            "Remada Aberta Polia": "COSTAS",
            "Puxada Alta Triângulo": "COSTAS",
            "Remada Baixa": "COSTAS",
            "Pulley Frente": "COSTAS",
            "Peck Deck": "PEITO",
            "Supino Inclinado com Halteres": "PEITO",
            "Supino Reto Halteres": "PEITO",
            "Crossover Superior": "PEITO",
            "Crossover Inferior": "PEITO",
            "Agachamento Búlgaro": "PERNAS (QUADRÍCEPS/GLÚTEO)",
            "Agachamento Livre": "PERNAS (QUADRÍCEPS/GLÚTEO)",
            "Cadeira Extensora Quadríceps Femoral": "PERNAS (QUADRÍCEPS/GLÚTEO)",
            "Cadeira Extensora Unilateral": "PERNAS (QUADRÍCEPS/GLÚTEO)",
            "Leg Press": "PERNAS (QUADRÍCEPS/GLÚTEO)",
            "Hack Machine": "PERNAS (QUADRÍCEPS/GLÚTEO)",
            "Mesa Flexora": "POSTERIOR DE COXA",
            "Stiff": "POSTERIOR DE COXA",
            "Gêmeos em Pé": "PANTURRILHA",
            "Gêmeos Sentado": "PANTURRILHA",
            "Tríceps Polia Bilateral com Corda": "TRÍCEPS",
            "Tríceps Testa": "TRÍCEPS",
            "Tríceps Francês": "TRÍCEPS",
            "Rosca Martelo": "BÍCEPS",
            "Rosca Inversa": "BÍCEPS",
            "Rosca Direta": "BÍCEPS",
            "Rosca 45º": "BÍCEPS",
            "Elevação Lateral Halteres": "OMBRO",
            "Elevação Lateral Polia": "OMBRO",
            "Flexão de Punho": "ANTEBRAÇO",
            "Cadeira Adutora": "ADUTORES/ABDUTORES",
            "Cadeira Abdutora": "ADUTORES/ABDUTORES"
        };

        // --- DADOS MOCKADOS (Simulando uma rotina salva na Tela 2) ---
        const mockRoutineData = {
            nomeRotina: "FULL BODY",
            sessoes: [
                {
                    nomeSessao: "SESSÃO 1",
                    diaSessao: "TERÇA",
                    exercicios: [
                        { nome: "Supino Reto Halteres", series: ["Reconhecimento", "1ª Válida", "2ª Válida"] },
                        { nome: "Supino Inclinado com Halteres", series: ["Reconhecimento", "1ª Válida", "2ª Válida"] },
                        { nome: "Puxada Alta Triângulo", series: ["Reconhecimento", "1ª Válida", "2ª Válida", "3ª Válida"] },
                        { nome: "Agachamento Livre", series: ["Reconhecimento", "1ª Válida", "2ª Válida"] }
                    ]
                },
                {
                    nomeSessao: "SESSÃO 2",
                    diaSessao: "QUINTA",
                    exercicios: [
                        { nome: "Leg Press", series: ["Reconhecimento", "1ª Válida", "2ª Válida", "3ª Válida"] },
                        { nome: "Remada Articulada Fechada", series: ["Reconhecimento", "1ª Válida", "2ª Válida"] },
                        { nome: "Rosca Direta", series: ["Reconhecimento", "1ª Válida"] },
                        { nome: "Tríceps Testa", series: ["Reconhecimento", "1ª Válida"] }
                    ]
                }
            ]
        };

        // --- GERAÇÃO DE DROPDOWNS PARA OS INPUTS ---
        let weightOptionsHTML = '';
        for (let i = 1; i <= 250; i++) weightOptionsHTML += `<option value="${i}">${i}</option>`;
        
        let repOptionsHTML = '';
        for (let i = 1; i <= 25; i++) repOptionsHTML += `<option value="${i}">${i}</option>`;

        // --- NAVEGAÇÃO BÁSICA ---
        const screens = {
            s1: document.getElementById('screen-1'),
            s3: document.getElementById('screen-3'),
            s4: document.getElementById('screen-4')
        };

        function switchScreen(activeScreen) {
            Object.values(screens).forEach(s => s.classList.remove('active'));
            activeScreen.classList.add('active');
        }

        document.getElementById('btn-cronograma').addEventListener('click', () => switchScreen(screens.s3));
        document.getElementById('back-to-home').addEventListener('click', () => switchScreen(screens.s1));
        document.getElementById('back-to-menu').addEventListener('click', () => switchScreen(screens.s3));

        // --- LÓGICA DA TELA 4: EXECUÇÃO ---
        const dayRefHeader = document.getElementById('exec-day-ref');
        const dateInput = document.getElementById('exec-date');
        const sessionSelect = document.getElementById('exec-session-select');
        const execContainer = document.getElementById('exec-container');
        const diasDaSemana = ["DOMINGO", "SEGUNDA", "TERÇA", "QUARTA", "QUINTA", "SEXTA", "SÁBADO"];

        // Estado para armazenar os exercícios salvos durante o treino na Tela 4
        let treinoExecutadoEstado = {};

        // 1. Atualizar Dia da Semana automaticamente ao mudar a Data
        dateInput.addEventListener('change', (e) => {
            const val = e.target.value;
            if(!val) return;
            // Split para evitar problemas de fuso horário que o JS Date costuma ter ao fazer parse de string "YYYY-MM-DD"
            const parts = val.split('-'); 
            const dateObj = new Date(parts[0], parts[1] - 1, parts[2]);
            dayRefHeader.textContent = diasDaSemana[dateObj.getDay()];
        });

        // 2. Setar data de hoje ao abrir
        function setTodayDate() {
            const hoje = new Date();
            const ano = hoje.getFullYear();
            const mes = String(hoje.getMonth() + 1).padStart(2, '0');
            const dia = String(hoje.getDate()).padStart(2, '0');
            dateInput.value = `${ano}-${mes}-${dia}`;
            dayRefHeader.textContent = diasDaSemana[hoje.getDay()];
        }

        // 3. Renderizar uma Sessão (Agrupando e criando os cards)
        function renderSession(session) {
            execContainer.innerHTML = ''; // Limpa o container
            treinoExecutadoEstado = {}; // Reseta o estado da sessão atual
            
            // Agrupar exercícios pelo Dicionário
            const groups = {};
            session.exercicios.forEach(ex => {
                const muscle = muscleDictionary[ex.nome] || "OUTROS";
                if(!groups[muscle]) groups[muscle] = [];
                groups[muscle].push(ex);
            });

            // Gerar o HTML agrupado
            for (const [muscle, exercises] of Object.entries(groups)) {
                
                const groupDiv = document.createElement('div');
                groupDiv.className = 'muscle-group';
                
                // Título do Músculo
                groupDiv.innerHTML = `<h3 class="muscle-title">${muscle}</h3>`;
                
                // Carrossel
                const carousel = document.createElement('div');
                carousel.className = 'carousel';
                
                // Definir se é card único para ocupar 100% ou carrossel (88%)
                const cardClass = exercises.length === 1 ? 'carousel-card single-card' : 'carousel-card';

                exercises.forEach(ex => {
                    const card = document.createElement('div');
                    card.className = cardClass;

                    let setsHTML = '';
                    ex.series.forEach(serie => {
                        setsHTML += `
                            <div class="exec-set-row" data-serie="${serie}">
                                <span class="exec-set-label">${serie}</span>
                                <div class="exec-set-inputs">
                                    <select class="select-kg">${weightOptionsHTML}</select>
                                    <span class="exec-suffix">kg x</span>
                                    <select class="select-reps">${repOptionsHTML}</select>
                                    <span class="exec-suffix">Reps</span>
                                </div>
                            </div>
                        `;
                    });

                    card.innerHTML = `
                        <h4 class="exec-card-title">${ex.nome}</h4>
                        <div class="exec-sets-wrapper" style="display: flex; flex-direction: column; gap: 12px;">
                            ${setsHTML}
                        </div>
                        <div class="card-footer">
                            <button type="button" class="btn-card-action">SALVAR</button>
                        </div>
                    `;

                    // Lógica isolada de Salvar / Corrigir para este card específico
                    const btnAction = card.querySelector('.btn-card-action');
                    const selects = card.querySelectorAll('select');
                    const setRows = card.querySelectorAll('.exec-set-row');

                    btnAction.addEventListener('click', () => {
                        const isSaved = card.classList.contains('card-salvo');

                        if (!isSaved) {
                            // AÇÃO DE SALVAR -> Transiciona para Estado 2 (Salvo)
                            const seriesExecutadas = [];
                            setRows.forEach(row => {
                                const nomeSerie = row.getAttribute('data-serie');
                                const kg = Number(row.querySelector('.select-kg').value);
                                const reps = Number(row.querySelector('.select-reps').value);
                                seriesExecutadas.push({ serie: nomeSerie, kg, reps });
                            });

                            // Salva no objeto de estado do treino executado
                            treinoExecutadoEstado[ex.nome] = {
                                dataExecucao: dateInput.value,
                                sessao: session.nomeSessao,
                                series: seriesExecutadas
                            };

                            // Aplica o feedback visual e trava os selects
                            card.classList.add('card-salvo');
                            selects.forEach(s => s.disabled = true);
                            btnAction.textContent = 'CORRIGIR';
                            btnAction.classList.add('btn-corrigir');

                            console.log(`[SALVO] ${ex.nome}:`, treinoExecutadoEstado[ex.nome]);
                        } else {
                            // AÇÃO DE CORRIGIR -> Retorna ao Estado 1 (Ativo)
                            card.classList.remove('card-salvo');
                            selects.forEach(s => s.disabled = false);
                            btnAction.textContent = 'SALVAR';
                            btnAction.classList.remove('btn-corrigir');

                            console.log(`[EM EDIÇÃO] ${ex.nome} desbloqueado para correção.`);
                        }
                    });

                    carousel.appendChild(card);
                });

                groupDiv.appendChild(carousel);
                execContainer.appendChild(groupDiv);
            }
        }

        // 4. Iniciar rotina mockada ao clicar no botão da Tela 3
        document.getElementById('btn-open-mock').addEventListener('click', () => {
            switchScreen(screens.s4);
            
            document.getElementById('exec-routine-name').textContent = mockRoutineData.nomeRotina;
            setTodayDate();

            // Popular select de sessões
            sessionSelect.innerHTML = '';
            mockRoutineData.sessoes.forEach((sessao, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.textContent = sessao.nomeSessao;
                sessionSelect.appendChild(opt);
            });

            // Renderiza a primeira sessão inicialmente
            renderSession(mockRoutineData.sessoes[0]);
        });

        // 5. Mudar de sessão pelo Select
        sessionSelect.addEventListener('change', (e) => {
            const index = e.target.value;
            renderSession(mockRoutineData.sessoes[index]);
            // Opcional: Atualizar a data baseada no dia planejado? 
            // O requisito diz que a data muda o dia, não que a sessão força uma data. Então mantemos livre.
        });

    </script>
</body>
</html>
